<!DOCTYPE html>

        body {

            margin: 50px auto;
            padding: 0 20px;
            color: #2c3e50;
            background-color: #fdfdfd;
            text-align: center;
        }
        .logo {
            font-size: 2.2em;

            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            text-decoration: none;
            color: #0969da;
            font-weight: 500;
            transition: all 0.15s ease;
            background: #f6f8fa;
        }
        .btn-link:hover {
            background: #0969da;
            color: #ffffff;
            border-color: #0969da;
            transform: translateY(-1px);
        }
        .flag {
